<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Musical Bingo</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 10%, #3a1d6e, #140f2e 60%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(560px, calc(100% - 32px)); text-align: center; }
      h1 { font-size: clamp(32px, 7vw, 52px); margin: 0 0 8px; }
      p { color: #c9c2e8; margin: 0 0 32px; }
      a { display: block; margin: 12px 0; padding: 20px; border-radius: 16px; background: rgba(255,255,255,.08); color: #fff; text-decoration: none; font-size: 20px; font-weight: 600; border: 1px solid rgba(255,255,255,.12); }
      a:hover { background: rgba(255,255,255,.15); }
      small { display: block; font-weight: 400; color: #c9c2e8; font-size: 14px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>🎵 Musical Bingo</h1>
      <p>Pick what this device is for tonight.</p>
      <a href="/play">I'm a player<small>Join a game on your phone</small></a>
      <a href="/display">Big screen<small>The computer connected to the projector / TV</small></a>
      <a href="/presenter">Presenter<small>Prepare questions and run the game</small></a>
    </main>
  </body>
</html>
